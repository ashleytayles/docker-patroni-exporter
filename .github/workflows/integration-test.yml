name: Integration Test

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build patroni-exporter image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: patroni-exporter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start test cluster
        working-directory: tests
        run: |
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 180
        env:
          PATRONI_EXPORTER_IMAGE: patroni-exporter:test

      - name: Run metrics integration test
        run: ./tests/test-metrics.sh

      - name: Show container logs on failure
        if: failure()
        working-directory: tests
        run: docker compose -f docker-compose.yml logs

      - name: Tear down
        if: always()
        working-directory: tests
        run: docker compose -f docker-compose.yml down -v
